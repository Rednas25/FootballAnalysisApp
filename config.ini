[paths]
# Ścieżka do modelu YOLO wykrywającego piłkarzy i innych obiektów meczu.
players_model = assets/models/FootballElementsYolo11s.pt

# Ścieżka do modelu YOLO wykrywającego punkty kluczowe boiska (linie, rogi, środek).
pitch_kp_model = assets/models/KPYolo11x400ep.pt

# Obraz boiska używany jako tło do heatmap i map średnich pozycji.
pitch_image = assets/pitch/pitch.png

# Plik CSV z odpowiadającymi punktami boiska do estymacji homografii.
pitch_points_csv = assets/pitch/pitch_points2.csv


[pitch]
# Rozdzielczość wejściowa modelu do punktów boiska (rozmiar obrazu wejściowego dla YOLO).
imgsz = 640

# Minimalny współczynnik pewności (confidence) dla detekcji elementów boiska.
conf = 0.6

# Minimalny współczynnik pewności (confidence) dla punktów kluczowych boiska.
kp_conf = 0.6

# Współczynnik wygładzania homografii
# Wartości bliskie 1.0 dają bardziej stabilną, ale wolniej reagującą homografię.
ema_factor = 0.9


[tracking]
# Minimalny margines przewagi dopasowania kolorów do jednej drużyny nad drugą,
# aby uznać zmianę drużyny za wystarczająco pewną.
strong_color_margin = 0.35

# Kara za "słaby" dowód kolorystyczny. Im większa wartość, tym mniej chętnie
# system akceptuje zmianę drużyny przy niewielkiej różnicy w dopasowaniu kolorów.
weak_color_penalty = 1.5

# Minimalna wymagana różnica (margin) między dopasowaniem do TEAM A i TEAM B,
# aby uznać obserwację przy zmianie drużyny.
margin_min = 6.0

# Współczynnik określający, jak silnie pozycja zawodnika na boisku wpływa na klasyfikację.
# np. dla bramkarza pozycja blisko własnej bramki podnosi wiarygodność przypisania.
prox_factor = 1.5

# Jak bardzo kolor drużyny musi być lepszy od koloru sędziego, żeby
# został przeklasyfikowany na zawodnika.
# Im mniejsza wartość, tym trudniej zostać sędzią.
referee_overrule_factor = 0.5

[colors]
# Próg łączenia podobnych klastrów kolorów w przestrzeni CIE Lab (a*, b*).
# Niższe wartości = bardziej rozróżniamy podobne odcienie; wyższe = mocniej łączymy.
kmeans_merge_delta_ab = 6

# Waga składowej L* (jasność) w metryce EMD.
# 0.0  = ignorujemy jasność (tylko a,b)
# 0.4  = bierzemy pod uwagę jasność (pomaga przy) czerni/bieli
# 1.0  = L tak samo ważne jak a i b
# >1.0 = Różnica jasności jest bardziej znacząca niż kolorów a,b (niezalezane)
emd_l_weight = 0.2

[quality_filter]
# Minimalna liczba kolejnych klatek ze stabilnym przypisaniem (TEAM, number), aby pozycja zawodnika została uznana za "jakościową".
min_stable_frames = 5

# Maksymalny dopuszczalny skok pozycji zawodnika w przestrzeni [0,1]x[0,1],
# pomiędzy kolejnymi próbkami. Większe wartości dopuszczają gwałtowniejsze ruchy.
max_delta01 = 0.08

# Czy w analizach statystycznych (heatmapy, średnie pozycje, minimapa), uwzględniać tylko próbki z quality_ok == 1.
use_quality_only = true


[visualization.maps2d]
# Rozmiar wygenerowanej mapy 2D boiska (w pikselach).
width = 600
height = 350

# Promień kropki reprezentującej średnią pozycję zawodnika.
dot_radius = 8

# Skala czcionki używanej do rysowania numeru zawodnika na mapie 2D.
label_scale = 0.5

# Grubość obwódki wokół kropki bramkarza (wyróżnienie bramkarza na mapie).
gk_outline_thickness = 2

[visualization.heatmaps]
# Rozdzielczość siatki histogramu (liczba komórek w osi szerokości i wysokości).
# Wyższe wartości dają bardziej szczegółową, ale potencjalnie bardziej zaszumioną heatmapę.
bins_w = 64
bins_h = 44

# Rozmiar jądra Gaussa stosowanego do wygładzania heatmapy.
# 0 lub 1 – brak wygładzania; większe wartości – bardziej gładna mapa.
gauss_blur_k = 4

# Przezroczystość nakładki heatmapy na obraz boiska (0.0–1.0).
alpha_overlay = 0.75

# Minimalna liczba próbek pozycji zawodnika wymagana do wygenerowania jego heatmapy.
min_samples = 5

# Czy przy generowaniu heatmap uwzględniać tylko próbki z quality_ok == 1.
use_quality_only = true

[replay]
# Liczba klatek przechowywanych w buforze do przodu podczas przewijania nagrania, w trybie odtwarzania.
buffer_size_frames = 300


[logging]
# Czy zapisywać plik positions_stream.csv z przetworzonymi pozycjami zawodników.
enable_positions_logging = true

# Czy zapisywać pliki annotation_stream.csv i pitch_keypoints.csv z adnotacjami oraz punktami kluczowymi boiska.
enable_annotations_logging = true
